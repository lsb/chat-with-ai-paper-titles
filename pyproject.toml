[project]
name = "chat-with-ai-paper-titles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.2.0",
    "gradio>=5.49.1",
    "huggingface-hub>=0.35.3",
    "lark>=1.3.0",
    "llguidance>=1.2.0",
    "optimum-quanto>=0.2.7",
    "outlines>=1.2.7",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "sentence-transformers>=5.1.1",
    "sentencepiece>=0.2.1",
    "transformers>=4.57.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
